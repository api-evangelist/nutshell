- aid: nutshell:json-rpc
  name: Nutshell Legacy JSON-RPC API
  description: >-
    Nutshell's original JSON-RPC API, available since 2010. Nutshell states it is no longer adding new
    endpoints to this API but continues to support existing customers, making it a maintenance-only surface.
    Same HTTP Basic authentication as the REST API.
  humanURL: https://developers-rpc.nutshell.com
  baseURL: https://app.nutshell.com/api/v1/json
