aid: nutshell
name: Nutshell
description: Nutshell is a CRM and email-marketing platform for small and mid-sized B2B sales teams, combining pipeline
  management, contact and company records, activity tracking, reporting, sales automation and built-in outbound
  email campaigns in one workspace with mobile and desktop clients. For developers Nutshell publishes a documented
  REST API of 112 operations across 24 resource families at app.nutshell.com/rest, an authenticated GraphQL endpoint,
  a legacy JSON-RPC API kept alive for existing integrations, an outbound webhook firehose, read-only SQL access
  on the Enterprise plan, and a remote, OAuth-protected MCP server at app.nutshell.com/mcp that exposes read-only
  CRM context to AI assistants.
type: Index
