- 'strict-transport-security: max-age=15768000 ; includeSubDomains'
- 'x-content-type-options: nosniff'
- 'x-frame-options: sameorigin'
- 'content-security-policy: upgrade-insecure-requests ; frame-ancestors ''self'''
