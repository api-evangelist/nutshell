      properties:
        id:
          description: The API ID of this entity, formatted {integer}-{entityType}
          type: string
          example: 3-contacts
        relationship:
          type: string
        name:
          description: A shortcut to the name of the competitor
          type: string
        status:
          type: string
          enum:
          - potential
          - stole
          - beat
          - null
        links:
          properties:
            lead:
              type: string
            competitor:
              type: string
          type: object
      type: object
    LeadCompetitorMapResponse:
      properties:
        competitorMaps:
          type: array
          items:
            $ref: '#/components/schemas/LeadCompetitorMap'
        leads:
          type: array
          items:
            $ref: '#/components/schemas/Lead'
        competitors:
          type: array
          items:
            $ref: '#/components/schemas/Competitor'
      type: object
    LeadInstallment:
      properties:
        id:
