        isPaid:
          type: boolean
          example: true
      type: object
    LeadInstallmentValue:
      properties:
        currency:
          type: string
          example: USD
        amount:
          type: number
          format: float
          example: 1000
      type: object
    LeadOutcome:
      properties:
        id:
          description: The API ID of this entity, formatted {integer}-{entityType}
          type: string
          example: 3-contacts
        name:
          type: string
        status:
          type: string
        type:
          type: string
      type: object
    LeadProductMap:
      properties:
        id:
          description: The API ID of this entity, formatted {integer}-{entityType}
          type: string
          example: 3-contacts
        relationship: {}
        price:
          $ref: '#/components/schemas/value'
        name: {}
        unit: {}
        quantity:
          type: number
          format: float
        productType:
          type: string
          example: product
        links:
          properties:
            product:
              description: The product this map is for
              type: string
              example: 1-products
          type: object
      type: object
    LeadResponse:
      description: A full response object for a lead-related endpoint.
      properties:
        meta:
          $ref: '#/components/schemas/meta'
        links:
          type: object
        leads:
          type: array
          items:
            $ref: '#/components/schemas/FullLead'
      type: object
    ListItem:
      type: object
      allOf:
      - $ref: '#/components/schemas/HtmlLinkable'
      - $ref: '#/components/schemas/Avatarable'
      - properties:
          id:
            description: The API ID of this entity, formatted {integer}-{entityType}
            type: string
            example: 3-contacts
          primaryName:
            type: string
          primaryInfo:
            type: string
          relatedName:
            type: string
          relatedInfo:
            type: string
          relatedType:
            type: string
          relatedUrl:
            type: string
          relatedUrlPath:
            type: string
          primaryContact:
            type: string
          primaryAccount:
            type: string
          latlon:
            type: string
          mapUrl:
            type: string
          isDeleted:
            type: boolean
          fields:
            description: Various additional fields for the list item. View the example response for more
              details.
            type: array
            items:
              type: object
        type: object
    ListItemLead:
      description: Class ListItemLead
      allOf:
      - $ref: '#/components/schemas/ListItem'
    NutReportOnDemandReport:
      properties:
        id:
          description: The API ID of this entity, formatted {integer}-{entityType}
          type: string
          example: 3-contacts
        key:
          type: string
        data:
          type: array
          items:
            properties:
              bucket:
                $ref: '#/components/schemas/ReportBucket'
            type: object
        name:
          type: string
        prefix:
          type: string
        summary:
          $ref: '#/components/schemas/ReportBucket'
      type: object
    ReportBucket:
      description: Bucket of the report
      properties:
        bucket:
          description: The name of the bucket
          type: string
          example: best bucket
        count:
          $ref: '#/components/schemas/ReportCount'
        total:
          $ref: '#/components/schemas/ReportCount'
        bucketType:
          type: string
        bucketSubtype:
          type: string
        filters:
          description: The filters applied to the report
          type: array
          items:
            type: string
        segments:
          type: array
          items:
            type: string
      type: object
    ReportCount:
      description: Count of the report
      properties:
        formatted:
          description: The formatted value after applying the prefix and suffix
          type: string
        prefix:
          description: The prefix to apply to the value
          type: string
          example: $
        suffix:
          description: The suffix to apply to the value
          type: string
        value:
          description: The raw value to be formatted
          type: number
          example: 100
      type: object
    Stage:
      properties:
        id:
          description: The API ID of this entity, formatted {integer}-{entityType}
          type: string
          example: 3-contacts
        name:
          description: The name of the stage
          type: string
          example: Prospecting
        description:
          description: The purpose of the stage
          type: string
          example: Identify and qualify potential customers
        position:
          description: The order in which this stage appears in the pipeline
          type: integer
          example: 1
        activeAvatarUrl:
          type: string
        completeAvatarUrl:
          type: string
        incompleteAvatarUrl:
          type: string
        overdueAvatarUrl:
          type: string
        numSteps:
          description: The number of steps in this stage to move on to the next stage
          type: number
          example: 3
        canAdvanceStage:
          description: Can we advance the lead to this stage?
          type: boolean
          example: true
        links:
          description: A list of related entity IDs
          type: array
          items:
            properties:
              stageset:
                type: string
                example: 1-stagesets
            type: object
      type: object
    Stageset:
      properties:
        id:
          description: The API ID of this entity, formatted {integer}-{entityType}
          type: string
          example: 3-contacts
        name:
          description: The name of the pipeline
          example: Preimum Prospects Pipeline
        default:
          description: Whether this is the default pipeline for new leads.
          type: boolean
          example: true
        canAccess:
          description: Whether the user can access the stageset based on the current Nutshell plan.
          type: boolean
          example: true
        status:
          description: The status of the stageset. '1' for active, '2' for draft, '3' for retired
          type: integer
          enum:
          - '1'
          - '2'
          - '3'
      type: object
    createdTime:
      description: When the lead was created.
      properties:
        absoluteLocalizedString:
          description: The value formatted as a string
          type: string
          example: May 28, 2024
        timestamp:
          type: number
          example: '1234567890'
        value:
          description: The value to be formatted
          type: string
          example: May 28, 2024
      type: object
    dueTime:
      description: When the lead is due.
      properties:
        absoluteLocalizedString:
          description: The value formatted as a string
          type: string
          example: May 28, 2024
        timestamp:
          type: number
          example: '1234567890'
        value:
          description: The value to be formatted
          type: string
          example: May 28, 2024
      type: object
    meta:
      description: Information about the Nutshell instance making the request
      properties:
        instanceId:
          description: The Nutshell instance ID
          type: string
          example: '12345'
        siteId:
          description: Site ID for WebFX customers
          type: string
      type: object
    patchInput:
      type: array
      items:
        properties:
          op:
            description: The operation to perform
            type: string
            enum:
            - add
            - remove
            - replace
            - move
            - copy
            example: add
          path:
            description: The path to the attribute to patch. Can be used to update custom fields as well,
              such as using /leads/0/{customFieldName}
            type: string
            example: /leads/0/links/accounts/337-accounts
          value:
            description: The value to set, can be various types, please refer to our guide on JSON Patch
              for more information
            type: string
            example: 337-accounts
        type: object
    value:
      properties:
        formatted:
          description: The value formatted as a string
          type: string
          example: $100.00
        amount:
          description: The value as a number
          type: string
          example: '100.00'
        currency:
          description: The currency code
          type: string
          example: USD
      type: object
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
