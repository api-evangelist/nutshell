openapi: 3.0.0
info:
  title: Nutshell Emails API
  description: The most powerful API in the world
  version: 2.0.0
  contact:
    name: Nutshell Developers
    url: https://developers.nutshell.com
servers:
- url: https://app.nutshell.com/rest
  description: Nutshell REST API
tags:
- name: Emails
paths:
  /emails/{id}:
    get:
      tags:
      - Emails
      summary: Get an email
      operationId: 43ba2d674b5cc459bb8cdf42698d303f
      parameters:
      - name: id
        in: path
        description: Email ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Email
      security:
      - basicAuth: []
components:
  schemas: {}
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
